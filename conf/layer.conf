# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-px4"
BBFILE_PATTERN_meta-px4 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-px4 = "6"

LAYERDEPENDS_meta-px4 = "core"
LAYERSERIES_COMPAT_meta-px4 = "wrynose"

# px4-msgs/px4-ros2-cpp (dynamic-layers/meta-ros2-jazzy/) are ROS 2 Jazzy
# recipes -- only visible to bitbake when meta-ros2-jazzy's own
# BBFILE_COLLECTIONS name (ros2-jazzy-layer) is present in bblayers.conf.
# No LAYERDEPENDS needed on meta-px4's side; matches the same pattern
# meta-ros2 itself uses for its own dynamic-layers/meta-qt6/.
# specs/007-sitl-gazebo-ros2.md REQ-3.
BBFILES_DYNAMIC += "ros2-jazzy-layer:${LAYERDIR}/dynamic-layers/meta-ros2-jazzy/recipes-*/*/*.bb"
