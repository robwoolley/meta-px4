#@TYPE: Machine
#@NAME: Holybro Pixhawk 6X FMU (STM32H753, Cortex-M7)
#@DESCRIPTION: Machine configuration for the Holybro Pixhawk 6X flight
# management unit. Bare-metal target for PX4/NuttX firmware
# (specs/000, specs/001, specs/002) -- not a Linux machine.

require conf/machine/include/stm32h7.inc

DEFAULTTUNE = "cortexm7hf-fpv5d16"

SERIAL_CONSOLES = "57600;ttyS0"

# TCLIBC is deliberately not set here: it depends on which recipe is
# building (baremetal-helloworld needs TCLIBC="baremetal", set in the
# pixhawk6x multiconfig's local.conf per specs/001 REQ-3; PX4/NuttX's
# own libc story is a separate M2 decision, see specs/002 spec 001
# section 4.1).
