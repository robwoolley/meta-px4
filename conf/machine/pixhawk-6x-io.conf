#@TYPE: Machine
#@NAME: Holybro Pixhawk 6X FMU PX4IO coprocessor (STM32F100C8, Cortex-M3)
#@DESCRIPTION: Machine configuration for the Pixhawk 6X's PX4IO
# coprocessor (px4_io-v2_default). A separate MACHINE from
# pixhawk-6x because it's a different chip/tune (Cortex-M3, no FPU)
# entirely -- see specs/002 section 5.4. Bare-metal target for
# PX4/NuttX firmware, not a Linux machine.

require conf/machine/include/stm32f1-io.inc

DEFAULTTUNE = "cortexm3"

# CONFIG_USART1_SERIAL_CONSOLE=y (nuttx-config/nsh/defconfig) -- no
# CONFIG_USARTn_BAUD override present, so this is NuttX's stock
# 115200 default, not a value read from an explicit board setting.
SERIAL_CONSOLES = "115200;ttyS0"
