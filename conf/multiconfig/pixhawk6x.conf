#
# Multiconfig for the pixhawk-6x bare-metal firmware build, so it
# never requires changing the primary build's MACHINE/DISTRO.
# specs/001-machine-pixhawk-6x.md REQ-2.
#
MACHINE = "pixhawk-6x"

# specs/001 REQ-3: oe-core's baremetal-image class (baremetal-helloworld)
# needs TCLIBC="baremetal". PX4/NuttX firmware recipes (specs/002) may
# need a different TCLIBC value once written -- revisit then rather
# than assuming this covers both cases.
TCLIBC = "baremetal"
